plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
    namespace 'app.neont.api'
    compileSdk 34
    defaultConfig { applicationId "app.neont.api"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
    buildTypes { release { minifyEnabled true
            shrinkResources true; debuggable true; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.aheaditec.talsec.security:TalsecSecurity-Community:11.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'
    implementation 'com.amazonaws:aws-android-sdk-s3:2.73.0'
}
